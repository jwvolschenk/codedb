prompt = """
# codedb — Code Intelligence for AI Agents

codedb is a local code intelligence server. Index once, query via MCP tools.

## Critical Rule: Always Pass the Project Path

**Every MCP call MUST include `project=/absolute/path/to/project`.**

codedb does not assume a working directory. If you omit `project=`, the tool either fails or queries the wrong index.

```
codedb_search query="handleOrder" project=/home/user/repos/myapp
codedb_symbol name="OrderController" project=/home/user/repos/myapp
```

## Indexing

```
codedb_index path=/absolute/path/to/project
```

## Mono-Repos

Index each project separately. Do NOT index the mono-repo root.

```
codedb_index path=/home/user/monorepo/services/api
codedb_search query="UserService" project=/home/user/monorepo/services/api
```

## Tools

**Navigation:** codedb_tree, codedb_outline (grouped=true), codedb_ls, codedb_hot
**Search:** codedb_search (substring/regex), codedb_word (exact O(1)), codedb_symbol (definition), codedb_find (fuzzy filename), codedb_glob
**Analysis:** codedb_callers, codedb_deps (transitive=true), codedb_types, codedb_hierarchy, codedb_config_xref, codedb_routes
**Indexing:** codedb_index, codedb_index force=true, codedb_status, codedb_changes

## Batching

**Dependent chains** — use codedb_query:
```json
codedb_query pipeline=[
  {"op":"symbol","name":"handleRequest","body":true},
  {"op":"callers","name":"handleRequest"},
  {"op":"read","context_lines":5}
]
```

**Independent ops** — batch together:
```json
codedb_batch_execute commands=[
  {"tool":"codedb_status"},
  {"tool":"codedb_search","query":"TODO"}
]
```

Never make individual calls when batch is possible.

## Common Workflows

**Bug origin:** codedb_search for error → codedb_callers for failing method → codedb_read the code
**Feature walkthrough:** codedb_find for topic → codedb_outline grouped=true → codedb_deps transitive=true
**Refactor:** codedb_symbol for definition → codedb_callers for all sites → codedb_types for typed deps → change → codedb_index force=true

## Exclusions

.codedbignore in project root (gitignore syntax). Re-index with codedb_index force=true after changes.

## CLI

```bash
codedb /path/to/project search "query"
codedb /path/to/project find SymbolName
codedb /path/to/project tree
codedb /path/to/project outline src/File.cs
```

## Storage

- Snapshot: <project>/codedb.snapshot
- Cache: ~/.codedb/projects/<hash>/

## Pitfalls

1. Omitting project= on MCP calls. Every call must include the full absolute path.
2. Indexing a mono-repo root instead of individual projects. Pollutes search results.
3. Forgetting to re-index after .codedbignore changes. Use codedb_index force=true.
4. Making individual calls when batch is possible. Use codedb_query for chains.
5. Using codedb_search for exact identifiers. Use codedb_word (O(1)) instead.
"""
description = "codedb code intelligence MCP tools — indexing, search, symbols, dependencies, batching"
